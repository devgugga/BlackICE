quarkus.http.root-path=/

# OIDC em modo web-app (BFF): os tokens ficam num COOKIE de sessao HttpOnly,
# criptografado pelo TokenStateManager do Quarkus (NAO em store server-side).
# A propriedade BFF que importa se mantem: o access token nunca e legivel por JS.
# (Store realmente server-side, com rotacao, e hardening futuro.)
#
# ATENCAO - DEV/TEST APENAS: o Keycloak roda em HTTPS no host :8843 com cert
# self-signed SEM SAN, entao apontamos para localhost:8843 e DESABILITAMOS a
# verificacao TLS. Estas linhas valem para TODOS os profiles como estao e DEVEM
# ser sobrescritas antes de qualquer profile nao-dev (prod/compose falam com o
# Keycloak interno via rede e TLS valido). TODO: escopar/rever ao criar %prod.
quarkus.oidc.auth-server-url=https://localhost:8843/realms/dcm4chee
quarkus.oidc.client-id=blackice-quarkus
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.tls.verification=none

# Realm roles do Keycloak ficam sob realm_access.roles -> expor em SecurityIdentity
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Cookie de sessao endurecido (CSRF entra no Plano 2 com endpoints mutantes)
quarkus.oidc.token-state-manager.split-tokens=true
quarkus.oidc.token-state-manager.encryption-secret=${QUARKUS_OIDC_ENCRYPTION_SECRET}
quarkus.oidc.authentication.cookie-same-site=lax

# PKCE (S256) e exigido pelo client blackice-quarkus no Keycloak
# (pkce.code.challenge.method=S256). O Quarkus precisa enviar code_challenge
# na authorization request, senao o Keycloak rejeita com
# "invalid_request: Missing parameter: code_challenge_method".
quarkus.oidc.authentication.pkce-required=true
