worker_processes 1;
# Necessario para os workers terem permissao de leitura no socket real do
# Docker (bind-mount root:root 0660, sem acesso ao usuario nginx padrao).
user root;
events { worker_connections 64; }

http {
  # Docker Desktop neste host (dockerd 29.x, API minima 1.40) responde 400
  # a chamadas com prefixo de versao de API abaixo do minimo. O provider
  # docker do Traefik v3.1/v3.5 tem a versao de API v1.24 hardcoded na
  # primeira chamada de bootstrap (GET /v1.24/version) e nao expoe opcao de
  # config para mudar isso nem respeita DOCKER_API_VERSION. Este proxy
  # reescreve qualquer prefixo /vX.Y/ para uma versao suportada antes de
  # repassar ao socket real do daemon. Ver Task 6 report para o diagnostico
  # completo (packet capture com socat).
  upstream docker_upstream {
    server unix:/hostsock/docker.sock;
  }

  server {
    listen unix:/shared/docker.sock;

    # O provider do Traefik precisa apenas de leitura para descoberta. Limita
    # o socket aos endpoints observados de versao, eventos e inventario/inspect
    # de containers; qualquer mutacao ou endpoint diferente recebe 403.
    location ~ ^/v[0-9]+\.[0-9]+/(version|events|containers(?:/json|/[^/]+/json)?)$ {
      if ($request_method != GET) { return 403; }
      rewrite ^/v[0-9]+\.[0-9]+/(.*)$ /v1.43/$1 break;
      proxy_pass http://docker_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
    }

    location ~ ^/(version|events|containers(?:/json|/[^/]+/json)?)$ {
      if ($request_method != GET) { return 403; }
      proxy_pass http://docker_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
    }

    location / { return 403; }
  }
}
