services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      # Split frontchannel/backchannel (ver Task 6 no AGENTS/brief): dentro da
      # rede docker "keycloak:8843" NÃO é alcançável pelo browser, então essa
      # URL é só para o Quarkus falar com o Keycloak em backchannel (token
      # exchange, discovery). O discovery document devolvido pelo Keycloak
      # (KC_HOSTNAME=https://${DCM4CHEE_HOST}:8843 +
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true) já resolve o authorization_endpoint
      # para o host voltado ao browser (localhost:8843) automaticamente.
      QUARKUS_OIDC_AUTH_SERVER_URL: https://keycloak:8843/realms/dcm4chee
      QUARKUS_OIDC_SECRET: ${QUARKUS_OIDC_SECRET}
      QUARKUS_OIDC_ENCRYPTION_SECRET: ${QUARKUS_OIDC_ENCRYPTION_SECRET:?defina QUARKUS_OIDC_ENCRYPTION_SECRET em infra/.env}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      - keycloak
    networks: [blackice]

  frontend:
    build: ../apps/frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spa.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.spa.entrypoints=web"
      - "traefik.http.routers.spa.priority=1"
      - "traefik.http.services.spa.loadbalancer.server.port=80"
    networks: [blackice]
