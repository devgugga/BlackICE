services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      # Split frontchannel/backchannel (ver Task 6 no AGENTS/brief): dentro da
      # rede docker "keycloak:8080" NÃO é alcançável pelo browser, então essa
      # URL é só para o Quarkus falar com o Keycloak em backchannel (token
      # exchange, discovery) — plain HTTP, sem TLS no caminho, same-origin
      # (spec 2026-08-07). O discovery document devolvido pelo Keycloak usa
      # KC_HOSTNAME=http://${APP_HOST}/auth (fixo) para as URLs voltadas ao
      # browser, então o authorization_endpoint aponta para a origem do
      # Traefik (${APP_HOST}/auth), não para este endereço interno.
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true é o que faz o backchannel em si
      # resolver dinamicamente para o endereço que o chamador usou (aqui,
      # keycloak:8080), em vez de herdar o KC_HOSTNAME fixo.
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/blackice
      QUARKUS_OIDC_SECRET: ${QUARKUS_OIDC_SECRET}
      QUARKUS_OIDC_ENCRYPTION_SECRET: ${QUARKUS_OIDC_ENCRYPTION_SECRET:?defina QUARKUS_OIDC_ENCRYPTION_SECRET em infra/.env}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      - keycloak
    networks: [blackice]

  frontend:
    build: ../apps/frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spa.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.spa.entrypoints=web"
      - "traefik.http.routers.spa.priority=1"
      - "traefik.http.services.spa.loadbalancer.server.port=80"
    networks: [blackice]
